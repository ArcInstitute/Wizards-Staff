name: Complete Asana Task on Issue Close
on:
  issues:
    types: [closed]

jobs:
  complete-asana-task:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install asana
        run: pip install 'asana>=5,<6'

      - name: Complete Asana Task
        env:
          ASANA_TOKEN: ${{ secrets.ASANA_TOKEN }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          python - <<'EOF'
          import os
          import sys
          import asana

          configuration = asana.Configuration()
          configuration.access_token = os.environ['ASANA_TOKEN']
          api_client = asana.ApiClient(configuration)

          tasks_api = asana.TasksApi(api_client)

          issue_url = os.environ['ISSUE_URL']

          issues_parent_task_gid = '1211152257319662'

          opts = {'opt_fields': 'gid,name,notes,completed', 'limit': 100}

          try:
              subtasks = tasks_api.get_subtasks_for_task(issues_parent_task_gid, opts)

              matching_task = None
              scanned = 0
              for task in subtasks:
                  scanned += 1
                  # NOTE: dict.get(key, default) returns None (not default) when
                  # the key exists but its value is None, so coerce explicitly.
                  notes = task.get('notes') or ''
                  if issue_url in notes:
                      matching_task = task
                      break

              print(f"Scanned {scanned} subtask(s) looking for: {issue_url}")

              if matching_task:
                  if matching_task.get('completed'):
                      print(f"Task '{matching_task['name']}' is already completed.")
                  else:
                      update_body = {"data": {"completed": True}}
                      tasks_api.update_task(update_body, matching_task['gid'], {})
                      print(
                          f"Asana task '{matching_task['name']}' marked as complete! "
                          f"Task GID: {matching_task['gid']}"
                      )
              else:
                  print(f"No Asana subtask found containing issue URL: {issue_url}")
                  sys.exit(1)

          except Exception as e:
              print(f"Error: {e}")
              raise
          EOF

